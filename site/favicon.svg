<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="commvita">
  <title>commvita</title>
  <!-- Brand small-use cut: the mark thins to three joins below 20px, per the
       identity mockup. A favicon is drawn at 16-32px, so this is the cut to use. -->
  <rect width="100" height="100" rx="22" fill="#FFFFFF"/>
  <g transform="translate(50 50) scale(0.82) translate(-50 -50)">
    <line x1="52" y1="49" x2="22" y2="30" stroke="#141C2E" stroke-width="9" stroke-linecap="round"/>
    <line x1="52" y1="49" x2="80" y2="20" stroke="#141C2E" stroke-width="9" stroke-linecap="round"/>
    <line x1="52" y1="49" x2="84" y2="66" stroke="#141C2E" stroke-width="9" stroke-linecap="round"/>
    <circle cx="22" cy="30" r="12" fill="#00B8A6"/>
    <circle cx="80" cy="20" r="10" fill="#7B61FF"/>
    <circle cx="84" cy="66" r="13" fill="#FF5B47"/>
    <circle cx="52" cy="49" r="19" fill="#141C2E"/>
    <circle cx="52" cy="49" r="7.5" fill="#FFFFFF"/>
  </g>
</svg>
